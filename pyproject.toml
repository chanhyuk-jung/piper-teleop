[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/piper_teleop/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true


[project]
name = "piper-teleop"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0.0,<2.3.0",
    "placo",
    "scipy",
    "websockets",
    "ischedule",
    "tyro",
    "opencv-python-headless>=4.9.0,<4.14.0",
    "zarr>=3.2.0",
    "rerun-sdk",
    "agx_bus>=0.4.0",
    "tqdm",
    "optree",
    "pillow",
    "imagecodecs[all]>v2026.5.10",
]
version = "0.0.1"

[project.scripts]
teleop-server = "piper_teleop.server:server_cli"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["stubs"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "ASYNC"
]
ignore = []


[tool.ty]

[tool.ty.analysis]
allowed-unresolved-imports = ["Boost.Python"]

[tool.ty.environment]
extra-paths = ["stubs"]
python-version = "3.12"
