[build-system]
requires = ["uv_build >= 0.12.10, <0.13.0"]
build-backend = "uv_build"

[project]
name = "piper-client"
requires-python = ">=3.12"
dependencies = [
    "pyAgxArm @ https://github.com/agilexrobotics/pyAgxArm.git",
    "numpy>=2.0.0,<2.3.0",
]
version = "0.0.0"

[project.optional-dependencies]
dev = [
    "ruff",
    "ty",
    "mypy",
]

teleop = [
    "placo",
    "scipy",
    "websockets",
    "ischedule",
    "click",
    "opencv-python-headless>=4.9.0,<4.14.0",
    "zarr>=3.2.0",
    "rerun-sdk",
]

all = [
    "piper-client[teleop]"
]

[project.scripts]
teleop-server = "piper_client.server:main"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["stubs"]

[tool.ruff.lint]
# E, W: pycodestyle errors and warnings
# F: PyFlakes
# I: isort
# UP: pyupgrade
# B: flake8-bugbear (good practices, potential bugs)
# C4: flake8-comprehensions (more concise comprehensions)
# A: flake8-builtins (shadowing builtins)
# SIM: flake8-simplify
# RUF: Ruff-specific rules
# D: pydocstyle (for docstring style/formatting)
# S: flake8-bandit (some security checks, complements Bandit)
# T20: flake8-print (discourage print statements in production code)
# N: pep8-naming
select = [
    "E", "W", "I", "F"
]
ignore = [
    "T201", # Print statement found
    "T203", # Pprint statement found
    "B008", # Perform function call in argument defaults
]


[tool.ty]

[tool.ty.analysis]
allowed-unresolved-imports = ["Boost.Python"]

[tool.ty.environment]
extra-paths = ["stubs"]
python-version = "3.12"
